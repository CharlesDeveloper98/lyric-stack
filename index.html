<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LyricSpot - Apple Music Liquid Glass</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Dynamic Mesh Background (Liquid Glass Accents) -->
    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-badge">
                <span class="pulse-dot"></span> Apple Music Glass UI
            </div>
            <h1>LyricSpot</h1>
            <p class="subtitle-header">Search any track to instantly explore lyrics</p>
        </header>

        <!-- Liquid Glass Search Bar -->
        <section class="search-section">
            <div class="glass-search-box">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input type="text" id="search-input" placeholder="Search song title or artist..." autocomplete="off">
                <button id="clear-btn" class="clear-btn hidden">&times;</button>
            </div>
        </section>

        <!-- Dynamic Results / State Container -->
        <section id="results-section" class="glass-card results-card hidden">
            <div class="results-header">
                <h3 id="results-title">Search Results</h3>
                <button id="close-results" class="icon-btn">&times;</button>
            </div>
            <div id="results-content" class="results-body">
                <!-- Populated dynamically -->
            </div>
        </section>

        <!-- Lyrics Modal / View Panel -->
        <section id="lyrics-section" class="glass-card lyrics-card hidden">
            <div class="lyrics-header">
                <div>
                    <span id="lyrics-artist-tag" class="artist-tag">Artist</span>
                    <h3 id="lyrics-title">Song Title</h3>
                </div>
                <button id="close-lyrics" class="icon-btn">&times;</button>
            </div>
            <div id="lyrics-content" class="lyrics-body">
                <p class="placeholder-text">Loading lyrics vector...</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
